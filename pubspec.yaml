name: recipe_app
description: "Recipe App Using clean Architecture"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  build_runner: ^2.4.13
  connectivity_plus: ^7.1.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.2.3
  hive_ce: ^2.13.0
  hive_ce_flutter: ^2.3.0
  hive_ce_generator: ^1.11.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

flutter_native_splash:
  color: "#FF9800"
  image: assets/images/splash.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FF9800"
    image: assets/images/splash.png
